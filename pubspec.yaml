name: flamingo_parent
description: Flamingo Parent App - Keep your child safe
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  equatable: ^2.0.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  agora_rtc_engine: ^6.3.0
  get_it: ^7.6.7
  permission_handler: ^11.1.0
  intl: ^0.19.0
  http: ^1.1.0
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  audioplayers: ^5.2.1
  vibration: ^1.8.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
